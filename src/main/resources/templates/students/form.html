<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Student Form - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/students">
            <i class="bi bi-mortarboard-fill me-2"></i>Student Management System
        </a>
    </div>
</nav>

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="card-title mb-0" th:text="${pageTitle}">Add / Edit Student</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i><span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/students}" th:object="${student}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="studentId" class="form-label font-weight-bold">Student ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="studentId" th:field="*{studentId}" placeholder="e.g. STU1001" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label font-weight-bold">First Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" placeholder="First Name" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label font-weight-bold">Last Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" placeholder="Last Name" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label font-weight-bold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="student@university.edu" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label font-weight-bold">Department / Course <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="department" th:field="*{department}" placeholder="e.g. Computer Science" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="gpa" class="form-label font-weight-bold">GPA (0.0 - 4.0) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0.0" max="4.0" class="form-control" id="gpa" th:field="*{gpa}" placeholder="3.50" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('gpa')}" th:errors="*{gpa}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="enrollmentDate" class="form-label font-weight-bold">Enrollment Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="enrollmentDate" th:field="*{enrollmentDate}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('enrollmentDate')}" th:errors="*{enrollmentDate}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a th:href="@{/students}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Back to Directory
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-circle me-1"></i> Save Student
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
