<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/students">
            <i class="bi bi-mortarboard-fill me-2"></i>Student Management System
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                    <h4 class="card-title mb-0">
                        <i class="bi bi-person-vcard me-2"></i>Student Details
                    </h4>
                    <span class="badge bg-light text-primary fs-6" th:text="${student.studentId}">STU1001</span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="text-muted small">First Name</label>
                            <p class="fs-5 fw-bold text-dark" th:text="${student.firstName}">Alice</p>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Last Name</label>
                            <p class="fs-5 fw-bold text-dark" th:text="${student.lastName}">Smith</p>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Email Address</label>
                            <p class="fs-6 fw-semibold text-dark" th:text="${student.email}">alice.smith@university.edu</p>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Department / Program</label>
                            <p class="fs-6 fw-semibold">
                                <span class="badge bg-info text-dark" th:text="${student.department}">Computer Science</span>
                            </p>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">GPA</label>
                            <p class="fs-5 fw-bold text-success" th:text="${student.gpa}">3.85</p>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Enrollment Date</label>
                            <p class="fs-6 fw-semibold text-dark" th:text="${student.enrollmentDate}">2022-09-01</p>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-between align-items-center">
                        <a th:href="@{/students}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Back to Directory
                        </a>
                        <div>
                            <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning me-2">
                                <i class="bi bi-pencil me-1"></i> Edit
                            </a>
                            <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this student?');">
                                <i class="bi bi-trash me-1"></i> Delete
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
